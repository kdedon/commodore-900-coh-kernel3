# build -- link the kernel and its drivers against the toolchain this
# repository floats on.
#
# `ld -k' bakes the kernel's absolute addresses into every loadable driver, so
# the two are one artifact: a kernel that relinks and drivers that were not
# rebuilt is the failure this catches.  Both goals are named for that reason.
#
# Nothing here boots.  Whether the kernel RUNS is the dist repository's
# question, because that is where an image is packed.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: kernel3, fetch-depth: 0 }

      # RELEASES of the toolchain and of kboot, not checkouts of either.  The
      # kernel links five libc objects by name (kobj/), compiled from the
      # OPERATING SYSTEM's libc -- source the toolchain repository does not
      # hold -- so `make all' in a toolchain checkout builds a perfectly good
      # compiler with no kobj beside it.  kboot's checkout carries a whole
      # Z8001 program and its own tests, none of which a header consumer
      # needs.  Both release archives carry exactly what this build consumes;
      # DEPS names the tags.
      - name: The toolchain and kboot header this kernel is built with
        working-directory: kernel3
        run: |
          make deps
          # Which SHAPE resolved, in the log, beside the version: a release and
          # a checkout are both usable and they are not the same thing.
          sh mk/deps.sh -k toolchain
          sh mk/deps.sh -k kboot

      # Set, never searched: a job that depended on directory adjacency breaks
      # the first time a runner image moves its checkouts.  The search itself
      # is tested by resolver-isolation.yml, alone and deliberately.
      - name: Kernel and drivers
        working-directory: kernel3
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/kernel3/deps/commodore-900-toolchain
          C900_KBOOT: ${{ github.workspace }}/kernel3/deps/commodore-900-kboot
        run: make kernel drivers

      # fetch-depth: 0 above is what makes this answerable -- version.sh reads
      # the tag, and a shallow clone has none.
      - name: The build can name its own version
        working-directory: kernel3
        run: sh os/hostbuild/version.sh
